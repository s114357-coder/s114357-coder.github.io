<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速藍光跑酷王</title>
    <style>
        /* ==================== 1. 網頁整體樣式 ==================== */
        body {
            background-color: #0a0f1d; /* 深藍黑色底 */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* 科技感背景裝飾 */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 102, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 254, 0.1) 0%, transparent 40%);
        }

        .game-container {
            text-align: center;
            background: rgba(10, 25, 50, 0.5);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 183, 255, 0.15);
            border: 1px solid rgba(0, 183, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        h1 {
            margin: 0 0 10px 0;
            color: #00b7ff;
            text-shadow: 0 0 15px rgba(0, 183, 255, 0.6);
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        #scoreBoard {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #8fa0dd;
            letter-spacing: 1px;
        }

        #score, #highScore {
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            font-size: 1.2em;
        }

        /* ==================== 2. 遊戲畫布樣式 ==================== */
        canvas {
            background: linear-gradient(to bottom, #071126, #0d2046); /* 畫布深藍漸層 */
            border: 3px solid #00b7ff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 183, 255, 0.3);
            display: block;
        }

        .instruction {
            margin-top: 20px;
            color: #657b9a;
            font-size: 14px;
        }

        .instruction b {
            color: #00f2fe;
        }

        /* ==================== 3. 科技感按鈕樣式 ==================== */
        button {
            background: linear-gradient(45deg, #0072ff, #00f2fe);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>極速藍光跑酷王</h1>
        <div id="scoreBoard">SCORE: <span id="score">0</span> | BEST: <span id="highScore">0</span></div>
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        <p class="instruction">按 <b>空白鍵 (Space)</b>、<b>上方向鍵 (↑)</b> 或 <b>點擊畫面</b> 跳躍</p>
        <button id="startBtn">START GAME</button>
    </div>

    <script>
        // ==================== 4. JavaScript 遊戲邏輯 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');

        let gameRunning = false;
        let score = 0;
        let highScore = 0;
        let gameSpeed = 6;
        let obstacles = [];
        let particles = [];
        let gameLoopId;

        // 玩家設定 (耀眼藍)
        const player = {
            x: 60,
            y: 200,
            width: 30,
            height: 45,
            color: '#00f2fe',
            glowColor: 'rgba(0, 242, 254, 0.8)',
            velocityY: 0,
            gravity: 0.6,
            jumpForce: -12,
            isGrounded: false
        };

        // 粒子特效類別（跳躍時的藍色碎光）
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = Math.random() * -3 - 1;
                this.speedY = (Math.random() - 0.5) * 2;
                this.alpha = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#00b7ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00b7ff';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // 障礙物類別 (深藍水晶障礙)
        class Obstacle {
            constructor() {
                this.x = canvas.width;
                this.width = 20 + Math.random() * 15;
                this.height = 35 + Math.random() * 35;
                this.y = canvas.height - this.height;
                this.color = '#0055ff';
                this.glowColor = 'rgba(0, 85, 255, 0.8)';
            }
            update() {
                this.x -= gameSpeed;
            }
            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.glowColor;
                // 畫出帶有發光科技感的方塊
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // 加一條亮藍色的邊框
                ctx.strokeStyle = '#00f2fe';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                ctx.restore();
            }
        }

        // 事件監聽
        window.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && player.isGrounded && gameRunning) {
                jump();
            }
        });

        canvas.addEventListener('click', () => {
            if (player.isGrounded && gameRunning) {
                jump();
            }
        });

        startBtn.addEventListener('click', () => {
            startBtn.blur();
            initGame();
        });

        function jump() {
            player.velocityY = player.jumpForce;
            player.isGrounded = false;
            // 生成噴射粒子
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(player.x + player.width / 2, player.y + player.height));
            }
        }

        function initGame() {
            cancelAnimationFrame(gameLoopId);
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            particles = [];
            player.y = canvas.height - player.height;
            player.velocityY = 0;
            player.isGrounded = true;
            gameRunning = true;
            scoreEl.innerText = score;
            update();
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 遊戲主流程
        function update() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製背景裝飾線（科技感地平線）
            ctx.strokeStyle = 'rgba(0, 183, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 2);
            ctx.lineTo(canvas.width, canvas.height - 2);
            ctx.stroke();

            // 1. 玩家物理與繪製
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            if (player.y + player.height >= canvas.height) {
                player.y = canvas.height - player.height;
                player.velocityY = 0;
                player.isGrounded = true;
            }

            // 玩家跑步時也會有微量粒子
            if (player.isGrounded && Math.random() < 0.4) {
                particles.push(new Particle(player.x, player.y + player.height - 5));
            }

            ctx.save();
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.glowColor;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.restore();

            // 2. 處理粒子特效
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            // 3. 處理障礙物
            if (Math.random() < 0.015 && (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 250)) {
                obstacles.push(new Obstacle());
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (checkCollision(player, obstacles[i])) {
                    gameOver();
                    return;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreEl.innerText = score;
                    if (score % 5 === 0) gameSpeed += 0.5;
                }
            }

            gameLoopId = requestAnimationFrame(update);
        }

        function gameOver() {
            gameRunning = false;
            ctx.fillStyle = 'rgba(5, 12, 28, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.fillStyle = '#00f2fe';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f2fe';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            ctx.restore();

            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
            }
        }

        // 初始載入畫面
        ctx.fillStyle = '#00b7ff';
        ctx.font = '18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('READY? CLICK START TO PLAY', canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>

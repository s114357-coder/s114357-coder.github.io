<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的跑酷網頁遊戲</title>
    <style>
        /* CSS 樣式：設定遊戲畫面外觀 */
        body {
            background-color: #222;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            text-align: center;
        }

        canvas {
            background-color: #e0e0e0;
            border: 4px solid #fff;
            border-radius: 8px;
            display: block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        #score-board {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #game-over-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: #ff2a74;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #ff2a74;
            display: none;
            pointer-events: none;
        }

        .instruction {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

        <div class="instruction">按【空白鍵 Space】跳躍 / 重新開始</div>
        
        <div id="game-over-text">GAME OVER<br><span style="font-size: 18px; color: #fff;">按空白鍵重新挑戰</span></div>
    </div>
